; Настройки LibraryIS
[database]
; По умолчанию используется файловая база SQLite (ничего устанавливать не нужно).
; Для сервера PostgreSQL (как в ТЗ) закомментируйте строку ниже и раскомментируйте следующую:
; (нужен пакет psycopg2-binary: pip install psycopg2-binary)
url = sqlite:///data/library.db
; url = postgresql+psycopg2://library:пароль@localhost:5432/library

[app]
; срок выдачи по умолчанию (дней)
loan_days = 14
; максимум книг на руках у одного читателя
max_books = 5
; автоматический выход при бездействии (минут)
idle_minutes = 30
